name: Set up Python environment
description: Install a pinned uv release and synchronize the locked environment.
inputs:
  python-version:
    description: Python version to install
    required: true
    default: "3.13"
  uv-version:
    description: uv version to install
    required: true
    default: "0.12.5"
runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@v7.0.0
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install uv
      uses: astral-sh/setup-uv@v10.0.1
      with:
        version: ${{ inputs.uv-version }}
        enable-cache: true

    - name: Synchronize locked environment
      shell: bash
      run: uv sync --frozen
