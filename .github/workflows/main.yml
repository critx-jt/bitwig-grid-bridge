name: Bridge CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bridge-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality and packages
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7.0.1

      - name: Set up Python environment
        uses: ./.github/actions/setup-python-env

      - name: Set up Java
        uses: actions/setup-java@v5.7.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Run checks
        run: make check

      - name: Run Python type checks
        run: uv run mypy

      - name: Run Python tests
        run: make test

      - name: Build release bundle
        run: make release-bundle

      - name: Upload Python distributions
        uses: actions/upload-artifact@v7.0.1
        with:
          name: python-distributions
          path: dist/*
          if-no-files-found: error

      - name: Upload ready-to-use bundle
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ready-to-use-bundle
          path: release/*
          if-no-files-found: error

  python-tests:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - name: Check out
        uses: actions/checkout@v7.0.1

      - name: Set up Python environment
        uses: ./.github/actions/setup-python-env
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run Python tests
        run: make test

  extension:
    name: Bitwig extension
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7.0.1

      - name: Set up Java
        uses: actions/setup-java@v5.7.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build extension
        run: |
          make build-extension
          cp extension/target/BitwigGridBridge.jar BitwigGridBridge.bwextension

      - name: Upload extension
        uses: actions/upload-artifact@v7.0.1
        with:
          name: BitwigGridBridge
          path: BitwigGridBridge.bwextension
          if-no-files-found: error

  release:
    name: Publish tagged release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [quality, python-tests, extension]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python environment
        uses: ./.github/actions/setup-python-env

      - name: Set up Java
        uses: actions/setup-java@v5.7.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Validate release version
        shell: bash
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          package_version="$(uv run python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          test "$tag_version" = "$package_version"

      - name: Build release assets
        run: make release-bundle

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            release/BitwigGridBridge.bwextension \
            release/bitwig-grid-bridge-*.zip \
            dist/bitwig_grid_bridge-* \
            --generate-notes \
            --title "Bitwig Grid Bridge ${GITHUB_REF_NAME#v}" \
            --verify-tag
