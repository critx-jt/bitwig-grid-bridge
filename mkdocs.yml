site_name: Bitwig Grid Bridge
repo_url: https://github.com/critx-jt/bitwig-grid-bridge
site_url: https://critx-jt.github.io/bitwig-grid-bridge
site_description: Local Bitwig Studio bridge extension and inspectable Grid automation toolkit.
site_author: critx-jt
edit_uri: edit/main/docs/
repo_name: critx-jt/bitwig-grid-bridge
copyright: Maintained by <a href="https://github.com/critx-jt">critx-jt</a>.

docs_dir: docs
nav:
  - Producer guide:
      - Start here: index.md
      - Quickstart: quickstart.md
      - Installation: installation.md
      - Workflows: workflows.md
      - Automation scripts: scripting.md
      - Cheat sheet: cheatsheet.md
  - Agent reference:
      - Integration overview: agent/index.md
      - Workflow playbook: agent/workflows.md
      - Tool reference: agent/tools.md
      - Data and safety: agent/models.md
      - Protocol and lifecycle: agent/protocol.md
  - Grid reference:
      - Live device inventory: grid-device-inventory.md
      - Modulator catalog: grid-modulator-catalog.md
  - Development:
      - Engineering and releases: engineering.md
plugins:
  - search:
      lang: en
  - mkdocstrings:
      handlers:
        python:
          paths: [bitwig_mcp_server]
theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - search.highlight
    - search.share
    - toc.follow
    - content.code.copy
    - content.action.edit
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: deep orange
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: orange
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  icon:
    repo: fontawesome/brands/github
extra_css:
  - stylesheets/extra.css
extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/critx-jt/bitwig-grid-bridge

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.superfences
  - pymdownx.arithmatex:
      generic: true
  - tables
  - toc:
      permalink: true
      toc_depth: 3
