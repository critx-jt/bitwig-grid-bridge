[project]
name = "bitwig-grid-bridge"
version = "0.1.0"
description = "Companion MCP adapter for Bitwig Grid Bridge."
authors = [{ name = "John Stanford", email = "787382+jxstanford@users.noreply.github.com" }]
readme = "README.md"
keywords = ['python']
requires-python = ">=3.10,<4.0"
classifiers = [
    "Intended Audience :: Developers",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    "mcp[cli]==1.28.1",
    "pydantic==2.13.4",
    "pydantic-settings==2.15.0",
    "python-osc==1.10.2",
]

[project.urls]
Homepage = "https://github.com/critx-jt/bitwig-grid-bridge"
Repository = "https://github.com/critx-jt/bitwig-grid-bridge"
Documentation = "https://critx-jt.github.io/bitwig-grid-bridge/"


[dependency-groups]
dev = [
    "mkdocs==1.6.1",
    "mkdocs-material==9.7.7",
    "mkdocstrings[python]==1.0.6",
    "mypy==2.3.1",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "ruff==0.16.3",
]

[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project.scripts]
bitwig-mcp = "bitwig_mcp_server.app:main"

[tool.setuptools.packages.find]
include = ["bitwig_mcp_server*"]

[tool.mypy]
files = ["bitwig_mcp_server"]
disallow_untyped_defs = true
disallow_any_unimported = true
no_implicit_optional = true
check_untyped_defs = true
warn_return_any = true
warn_unused_ignores = true
show_error_codes = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
