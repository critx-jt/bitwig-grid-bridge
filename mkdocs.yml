site_name: Bitwig Grid Bridge
repo_url: https://github.com/critx-jt/bitwig-grid-bridge
site_url: https://critx-jt.github.io/bitwig-grid-bridge
site_description: Bitwig Studio bridge extension and Grid automation toolkit.
site_author: critx-jt
edit_uri: edit/main/docs/
repo_name: critx-jt/bitwig-grid-bridge
copyright: Maintained by <a href="https://github.com/critx-jt">critx-jt</a>.

nav:
  - Home: index.md
  - Installation: installation.md
  - Architecture: architecture.md
  - Modules: modules.md
plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [bitwig_mcp_server]
theme:
  name: material
  feature:
    tabs: true
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: white
      accent: deep orange
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: deep orange
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  icon:
    repo: fontawesome/brands/github

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/critx-jt/bitwig-grid-bridge
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/bitwig-mcp-server

markdown_extensions:
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
